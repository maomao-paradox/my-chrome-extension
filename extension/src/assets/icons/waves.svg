<svg xmlns="http://www.w3.org/2000/svg" width="240" height="50" viewBox="0 0 240 15">
  <defs>
    <!-- 1. 定义线性渐变色 -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- 左侧：深邃的蓝紫色 -->
      <stop offset="0%" stop-color="rgba(49,185,226,0.7)" />
      <stop offset="10%" stop-color="rgba(49,185,226,1)" />
      <stop offset="20%" stop-color="rgba(49,185,226,0.7)" />
      <!-- 中间：明亮的青蓝色 (你之前的颜色) -->
      <stop offset="60%" stop-color="rgba(49,185,226,1)" />
      <!-- 右侧：带点高光的亮蓝 -->
      <stop offset="100%" stop-color="rgba(49,185,226,0.7)" />
    </linearGradient>

    <style>
      .wave-blue {
        /* 2. 这里从纯色改为引用上面定义的渐变 */
        stroke: url(#waveGradient);
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        mix-blend-mode: screen;
      }
    </style>
  </defs>

  <!-- 原始波形，X 间隔改为 10 -->
  <polyline class="wave-blue" points="
    0,6.5
    10,5.2
    20,3.8
    30,2.5
    40,1.6
    50,1.1
    60,1.0
    70,1.1
    80,1.6
    90,2.5
    100,3.8
    110,5.2
    120,6.5
    130,7.8
    140,9.2
    150,10.5
    160,11.4
    170,11.9
    180,12.0
    190,11.9
    200,11.4
    210,10.5
    220,9.2
    230,7.8
    240,6.5
  " />

  <!-- 偏移波形，X 间隔改为 10，保留了你的 translate(-15, 2) -->
  <polyline class="wave-blue" points="
    20,1.1
    30,1.6
    40,2.5
    50,3.8
    60,5.2
    70,6.5
    80,7.8
    90,9.2
    100,10.5
    110,11.4
    120,11.9
    130,12.0
    140,11.9
    150,11.4
    160,10.5
    170,9.2
    180,7.8
    190,6.5
    200,5.2
    210,3.8
    220,2.5
    230,1.6
    240,1.1
    250,1.0
    260,1.1
  " transform="translate(-20, 2)" />
</svg>