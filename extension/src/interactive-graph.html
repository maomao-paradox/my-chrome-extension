<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目依赖关系网 - 蜘蛛网力导向图</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html,
      #chart {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f7fa;
      }

      /* ===== 控制面板优化 ===== */
      #controls {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 16px 20px 14px;
        border-radius: 12px;
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.1),
          0 1px 4px rgba(0, 0, 0, 0.06);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        z-index: 100;
        pointer-events: auto;
        min-width: 260px;
        transition:
          transform 0.2s ease,
          opacity 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      #controls .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      #controls .header label {
        font-size: 13px;
        font-weight: 500;
        color: #1a1a2e;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #controls .header .badge {
        font-size: 11px;
        background: #eef2f7;
        color: #4a5568;
        padding: 2px 10px;
        border-radius: 12px;
        font-weight: 400;
      }

      .search-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-wrapper .icon {
        position: absolute;
        left: 12px;
        font-size: 14px;
        opacity: 0.5;
        pointer-events: none;
      }

      .search-wrapper input {
        width: 100%;
        padding: 8px 14px 8px 36px;
        border: 1.5px solid #e2e8f0;
        border-radius: 24px;
        font-size: 14px;
        background: #f8fafc;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
        color: #1a202c;
      }

      .search-wrapper input::placeholder {
        color: #a0aec0;
        font-weight: 300;
      }

      .search-wrapper input:focus {
        border-color: #4299e1;
        box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        background: #ffffff;
      }

      .search-wrapper .clear-btn {
        position: absolute;
        right: 10px;
        background: none;
        border: none;
        font-size: 16px;
        color: #a0aec0;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 50%;
        transition: all 0.15s;
        display: none;
        line-height: 1;
      }

      .search-wrapper .clear-btn:hover {
        color: #e53e3e;
        background: #fff5f5;
      }

      .search-wrapper .clear-btn.visible {
        display: block;
      }

      #controls .tip {
        font-size: 12px;
        color: #718096;
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        border-top: 1px solid #edf2f7;
        padding-top: 10px;
      }

      #controls .tip span {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      #controls .tip .key {
        display: inline-block;
        background: #edf2f7;
        padding: 0 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
        color: #4a5568;
      }

      /* ===== 统计信息浮窗 ===== */
      #stats {
        position: absolute;
        bottom: 24px;
        left: 24px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 12px 18px;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        color: #2d3748;
        z-index: 100;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.3);
        display: flex;
        gap: 20px;
        align-items: center;
      }

      #stats .stat-item {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }

      #stats .stat-item .num {
        font-weight: 600;
        color: #2b6cb0;
        font-size: 15px;
      }

      #stats .stat-item .label {
        color: #718096;
        font-size: 12px;
      }

      #stats .divider {
        width: 1px;
        height: 20px;
        background: #e2e8f0;
      }

      /* ===== 响应式 ===== */
      @media (max-width: 640px) {
        #controls {
          top: 12px;
          right: 12px;
          left: 12px;
          min-width: unset;
          padding: 12px 14px;
        }

        #controls .header .badge {
          display: none;
        }

        #stats {
          bottom: 12px;
          left: 12px;
          right: 12px;
          font-size: 12px;
          padding: 10px 14px;
          flex-wrap: wrap;
          gap: 8px 16px;
          pointer-events: auto;
        }

        #stats .divider {
          display: none;
        }
      }

      /* ===== 加载状态 ===== */
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: system-ui, sans-serif;
        color: #4a5568;
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }

      #loading .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 12px;
        border: 3px solid #e2e8f0;
        border-top-color: #4299e1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #loading p {
        font-size: 14px;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <!-- 加载状态 -->
    <div id="loading">
      <div class="spinner"></div>
      <p>加载依赖数据中...</p>
    </div>

    <!-- 控制面板 -->
    <div id="controls">
      <div class="header">
        <label>🔍 搜索节点</label>
        <span class="badge" id="matchCount">0 个匹配</span>
      </div>
      <div class="search-wrapper">
        <span class="icon">🔎</span>
        <input
          type="text"
          id="search"
          placeholder="输入文件名或路径..."
          autocomplete="off"
        />
        <button class="clear-btn" id="clearBtn" aria-label="清空搜索">✕</button>
      </div>
      <div class="tip">
        <span>🖱️ 拖拽节点</span>
        <span>🔍 滚轮缩放</span>
        <span><span class="key">⌘F</span> 快速搜索</span>
      </div>
    </div>

    <!-- 统计信息 -->
    <div id="stats" style="display: none">
      <div class="stat-item">
        <span class="num" id="nodeCount">0</span>
        <span class="label">节点</span>
      </div>
      <div class="divider"></div>
      <div class="stat-item">
        <span class="num" id="edgeCount">0</span>
        <span class="label">依赖关系</span>
      </div>
      <div class="divider"></div>
      <div class="stat-item">
        <span class="num" id="npmCount">0</span>
        <span class="label">npm 依赖</span>
      </div>
    </div>

    <!-- 图表容器 -->
    <div id="chart"></div>

    <script type="module">
      import * as echarts from "echarts";

      // ===== DOM 引用 =====
      const chartDom = document.getElementById("chart");
      const loadingEl = document.getElementById("loading");
      const statsEl = document.getElementById("stats");
      const searchInput = document.getElementById("search");
      const clearBtn = document.getElementById("clearBtn");
      const matchCountEl = document.getElementById("matchCount");
      const nodeCountEl = document.getElementById("nodeCount");
      const edgeCountEl = document.getElementById("edgeCount");
      const npmCountEl = document.getElementById("npmCount");

      // ===== 工具函数：提取文件名 =====
      function getDisplayName(fullPath) {
        const parts = fullPath.split("/");
        let fileName = parts[parts.length - 1];
        // index 文件显示上级目录名
        if (
          [
            "index.ts",
            "index.js",
            "index.vue",
            "index.tsx",
            "index.jsx",
          ].includes(fileName)
        ) {
          if (parts.length >= 2) return parts[parts.length - 2];
        }
        return fileName;
      }

      // ===== 键盘快捷键：Ctrl/Cmd + F 聚焦搜索 =====
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "f") {
          if (document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
          }
        }
        if (e.key === "Escape" && document.activeElement === searchInput) {
          searchInput.value = "";
          clearBtn.classList.remove("visible");
          triggerSearch("");
          searchInput.blur();
        }
      });

      // ===== 清空按钮 =====
      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        clearBtn.classList.remove("visible");
        triggerSearch("");
        searchInput.focus();
      });

      searchInput.addEventListener("input", () => {
        const val = searchInput.value.trim();
        clearBtn.classList.toggle("visible", val.length > 0);
        triggerSearch(val);
      });

      // ===== 搜索逻辑（分离出来便于复用） =====
      let currentChart = null;
      let currentNodes = [];

      function triggerSearch(keyword) {
        if (!currentChart || !currentNodes.length) return;

        const lowerKeyword = keyword.toLowerCase();
        let matchCount = 0;

        const newData = currentNodes.map((node) => {
          const isMatch =
            lowerKeyword === ""
              ? false
              : node.name.toLowerCase().includes(lowerKeyword);
          if (isMatch) matchCount++;

          return {
            name: node.name,
            symbolSize: isMatch
              ? node.symbolSize * 1.6
              : node.symbolSize * (lowerKeyword ? 0.7 : 1),
            category: node.category,
            dependencyCount: node.dependencyCount,
            label: {
              show: true,
              fontSize: isMatch ? 13 : lowerKeyword ? 9 : 10,
              fontWeight: isMatch ? "bold" : "normal",
              color: isMatch ? "#e53e3e" : lowerKeyword ? "#a0aec0" : "#333",
              formatter: () => getDisplayName(node.name),
            },
            itemStyle: isMatch
              ? {
                  borderColor: "#e53e3e",
                  borderWidth: 3,
                  shadowBlur: 16,
                  shadowColor: "rgba(229, 62, 62, 0.4)",
                }
              : lowerKeyword
                ? { opacity: 0.25 }
                : {},
          };
        });

        matchCountEl.textContent = lowerKeyword
          ? `${matchCount} 个匹配`
          : "0 个匹配";
        matchCountEl.style.color = matchCount > 0 ? "#e53e3e" : "#4a5568";

        currentChart.setOption({ series: [{ data: newData }] });
      }

      // ===== 主数据加载 =====
      fetch("/deps.json")
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((rawData) => {
          console.log("📊 依赖数据加载成功", rawData);

          const nodes = [];
          const edges = [];
          const nodeIndexMap = new Map();
          const dependencyCount = new Map();

          // 计算依赖数量
          rawData.modules.forEach((module) => {
            const count = module.dependencies ? module.dependencies.length : 0;
            dependencyCount.set(module.source, count);
          });

          // 分类 & 节点生成
          function getCategoryAndSize(path) {
            let category = 0;
            let baseSize = 12;

            if (path.startsWith("node_modules/")) {
              category = 1;
              baseSize = 10;
            } else if (path.includes("/")) {
              const parts = path.split("/");
              if (parts[0] === "src" && parts[1]) {
                const map = {
                  components: { cat: 2, size: 14 },
                  utils: { cat: 3, size: 12 },
                  stores: { cat: 4, size: 12 },
                  types: { cat: 5, size: 10 },
                  api: { cat: 6, size: 12 },
                  message: { cat: 7, size: 12 },
                  event: { cat: 8, size: 12 },
                  "event-bus": { cat: 8, size: 12 },
                };
                const matched = map[parts[1]];
                if (matched) {
                  category = matched.cat;
                  baseSize = matched.size;
                }
              }
            }
            const count = dependencyCount.get(path) || 0;
            const symbolSize = Math.max(baseSize, baseSize + count * 0.8);
            return { category, symbolSize, dependencyCount: count };
          }

          // 添加节点
          function addNode(path) {
            if (nodeIndexMap.has(path)) return;
            nodeIndexMap.set(path, nodes.length);
            const info = getCategoryAndSize(path);
            nodes.push({
              name: path,
              symbolSize: info.symbolSize,
              category: info.category,
              dependencyCount: info.dependencyCount,
            });
          }

          // 遍历模块
          rawData.modules.forEach((module) => {
            addNode(module.source);
            if (module.dependencies) {
              module.dependencies.forEach((dep) => {
                const target = dep.resolved || dep.module;
                if (target) {
                  addNode(target);
                  edges.push({
                    source: nodeIndexMap.get(module.source),
                    target: nodeIndexMap.get(target),
                  });
                }
              });
            }
          });

          // 过滤孤立节点
          const connectedSet = new Set();
          edges.forEach((e) => {
            connectedSet.add(e.source);
            connectedSet.add(e.target);
          });
          const filteredNodes = nodes.filter((_, idx) => connectedSet.has(idx));
          const newMap = new Map();
          filteredNodes.forEach((n, i) => newMap.set(n.name, i));

          const filteredEdges = edges
            .filter(
              (e) =>
                newMap.has(nodes[e.source].name) &&
                newMap.has(nodes[e.target].name),
            )
            .map((e) => ({
              source: newMap.get(nodes[e.source].name),
              target: newMap.get(nodes[e.target].name),
            }));

          currentNodes = filteredNodes.map((n) => ({ ...n }));

          // ===== 统计信息 =====
          const npmCount = filteredNodes.filter((n) =>
            n.name.startsWith("node_modules/"),
          ).length;
          nodeCountEl.textContent = filteredNodes.length;
          edgeCountEl.textContent = filteredEdges.length;
          npmCountEl.textContent = npmCount;
          statsEl.style.display = "flex";

          // ===== 初始化 ECharts =====
          const chart = echarts.init(chartDom);
          currentChart = chart;

          // 窗口自适应
          window.addEventListener("resize", () => chart.resize());

          const option = {
            // 在 option 最外层添加
            dataZoom: [
              {
                type: "inside",
                disabled: false,
                zoomOnMouseWheel: true,
                moveOnMouseMove: true,
                moveOnMouseWheel: false,
              },
            ],
            title: {
              text: "🕸️ 项目依赖蛛网图",
              left: "center",
              top: 10,
              textStyle: {
                fontSize: 16,
                fontWeight: "normal",
                color: "#2d3748",
              },
            },
            tooltip: {
              formatter: (params) => {
                if (params.dataType === "node") {
                  const d = params.data;
                  return `<strong>${d.name}</strong><br/>📦 依赖数量: ${d.dependencyCount || 0}`;
                }
                if (params.dataType === "edge") {
                  const s = filteredNodes[params.data.source];
                  const t = filteredNodes[params.data.target];
                  return `${s?.name || "?"} → ${t?.name || "?"}`;
                }
                return "";
              },
            },
            legend: {
              data: [
                "本地文件",
                "npm依赖",
                "组件",
                "工具函数",
                "状态管理",
                "类型定义",
                "API",
                "消息",
                "事件总线",
              ],
              orient: "vertical",
              left: 10,
              top: 40,
              textStyle: { fontSize: 12 },
              icon: "circle",
              itemWidth: 10,
              itemHeight: 10,
            },
            series: [
              {
                type: "graph",
                layout: "force",
                force: {
                  repulsion: 2000,
                  edgeLength: 200,
                  gravity: 0.05,
                  friction: 0.1,
                  layoutAnimation: true,
                },
                roam: true,
                draggable: true,
                data: currentNodes.map((node) => ({
                  name: node.name,
                  symbolSize: node.symbolSize,
                  category: node.category,
                  dependencyCount: node.dependencyCount,
                  label: {
                    show: true,
                    position: "right",
                    fontSize: 10,
                    offset: [5, 0],
                    formatter: () => getDisplayName(node.name),
                  },
                })),
                links: filteredEdges,
                categories: [
                  { name: "本地文件", itemStyle: { color: "#3498db" } },
                  { name: "npm依赖", itemStyle: { color: "#27ae60" } },
                  { name: "组件", itemStyle: { color: "#e74c3c" } },
                  { name: "工具函数", itemStyle: { color: "#f39c12" } },
                  { name: "状态管理", itemStyle: { color: "#9b59b6" } },
                  { name: "类型定义", itemStyle: { color: "#1abc9c" } },
                  { name: "API", itemStyle: { color: "#34495e" } },
                  { name: "消息", itemStyle: { color: "#e67e22" } },
                  { name: "事件总线", itemStyle: { color: "#16a085" } },
                ],
                lineStyle: {
                  color: "#aaa",
                  curveness: 0.2,
                  width: 1.2,
                  opacity: 0.5,
                },
                edgeSymbol: ["none", "arrow"],
                edgeSymbolSize: [0, 6],
                focusNodeAdjacency: true,
                zoom: 0.8,
                itemStyle: {
                  borderColor: "#fff",
                  borderWidth: 1.5,
                },
              },
            ],
          };

          chart.setOption(option);

          // 隐藏加载状态
          loadingEl.style.display = "none";

          // ===== 延迟触发初始布局动画 =====
          setTimeout(() => {
            chart.resize();
          }, 100);
        })
        .catch((err) => {
          console.error("❌ 加载失败:", err);
          document.body.innerHTML = `
            <div style="color:#e53e3e; padding:40px; font-family:system-ui; text-align:center; max-width:600px; margin:60px auto; background:#fff5f5; border-radius:12px; border:1px solid #feb2b2;">
              <div style="font-size:48px; margin-bottom:16px;">⚠️</div>
              <h3 style="margin-bottom:8px;">加载依赖数据失败</h3>
              <p style="color:#718096; font-size:14px; margin-bottom:16px;">${err.message}</p>
              <code style="background:#edf2f7; padding:8px 14px; border-radius:6px; font-size:13px; display:inline-block;">
                npx depcruise --output-type json src > deps.json
              </code>
            </div>
          `;
        });
    </script>
  </body>
</html>
