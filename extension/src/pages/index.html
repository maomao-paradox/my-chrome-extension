<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="KIRA:NOVE 扩展页面快速导航" />
    <title>快速导航 - KIRA:NOVE</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #18212f;
        background: #f4f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 64px 24px;
      }

      main {
        width: min(100%, 880px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #526174;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 48px);
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 14px 0 32px;
        color: #657184;
        font-size: 16px;
        line-height: 1.7;
      }

      .pages {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }

      .page-link {
        display: flex;
        min-height: 120px;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        border: 1px solid #e1e6ec;
        border-radius: 14px;
        background: #fff;
        color: inherit;
        text-decoration: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .page-link:hover,
      .page-link:focus-visible {
        transform: translateY(-2px);
        border-color: #91a8c4;
        box-shadow: 0 10px 28px rgb(28 46 71 / 9%);
        outline: none;
      }

      .page-link strong {
        font-size: 17px;
      }

      .page-link span {
        margin-top: 10px;
        color: #758195;
        font-size: 13px;
        line-height: 1.5;
      }

      .empty {
        padding: 20px;
        border: 1px dashed #cbd3de;
        border-radius: 14px;
        color: #657184;
        line-height: 1.6;
      }

      footer {
        margin-top: 30px;
        color: #8a95a5;
        font-size: 12px;
      }

      @media (max-width: 520px) {
        body {
          padding: 40px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">KIRA:NOVE · EXTENSION</p>
      <h1>快速导航</h1>
      <p class="intro">选择一个页面，快速打开扩展中的常用入口。</p>
      <nav id="pages" class="pages" aria-label="扩展页面"></nav>
      <footer>仅显示当前构建版本中已启用的页面。</footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
